# Rock Configuration（能力全局化，数据项目化）
# 能力层（全局，装一次）：/c/Users/QZ/.pi/agent/packages/rock-research-agent/support/
# 数据层（每项目一套）：~/Research-projects/<项目>/
# 路径变量：${PROJECT_ROOT} = Agent 当前工作目录（项目文件夹）

# ── 全局能力层（固定，不随项目复制）──
capability:
  extensions_root: /c/Users/QZ/.pi/agent/packages/rock-research-agent/support
  research_core: /c/Users/QZ/.pi/agent/extensions/rock-research
  skills_dir: /c/Users/QZ/.pi/agent/skills           # 8 个 skill，软链到 ~/.pi/agent/skills/
  scripts_dir: /c/Users/QZ/.pi/agent/packages/rock-research-agent/support/scripts          # 桥接/维护脚本（逐项目执行）
  configs_dir: /c/Users/QZ/.pi/agent/packages/rock-research-agent/support/configs
  pi_global: ~/.pi                                       # Pi 自身全局状态 (agent/rag/wechat)

# ── 数据层（项目相对，切换项目即切换整套数据）──
paths:
  papers_dir: ${PROJECT_ROOT}/papers        # 本项目论文 PDF（按 rockburst/fracture/... 子分类）
  data_dir:   ${PROJECT_ROOT}/data          # 本项目三库 + rag 索引 + exports/backups
  plot_dir:   ${PROJECT_ROOT}/plot          # sci-plot 图表输出（不是 figures）
  logs_dir:   ${PROJECT_ROOT}/logs
  rag_dir:    ${PROJECT_ROOT}/.pi/rag       # 项目级 RAG 索引（由 rag_rebuild.mjs 生成，向上查找，回落 ~/.pi/rag）

# ── 项目库（按项目一套，落盘在项目 data/ 下，无全局库）──
# RAG 索引（chunks/files）在 ${PROJECT_ROOT}/.pi/rag/rag.db，无独立 papers.db
databases:
  memory:   ${ROCK_MEMORY_DIR:-$HOME/.pi/memory-data}   # 全局个人记忆库 pi_memory.db（本地 SQLite FTS5，由 memory_reindex 增量更新；不按项目隔离）
  research: ${PROJECT_ROOT}/data/research.db  # managed by rock-research（Claim/Evidence/Idea/Hypothesis；按项目隔离）

# ── Paper ingestion ──
ingestion:
  quality_threshold: 0.3          # below this → PaddleOCR fallback
  parse_workers: 1
  output_format: json
  output_dir: ${PROJECT_ROOT}/papers     # 解析 JSON 与 PDF 同目录
  scan_subdirs: [rockburst, fracture, tunnel, water, numerical, other]

# ── Research analysis modes ──
analysis:
  fast:   { target_time_ms: 1000 }
  normal: { target_time_ms: 5000 }
  deep:   { target_time_ms: 60000, rounds: 4 }

# ── Output reliability protocol（内部标签，不外显）──
output_labels: [FACT, SYNTHESIS, INTERPRETATION, HYPOTHESIS, IDEA, UNVERIFIED]

# ── Default agent behavior ──
defaults:
  llm_provider: agnes
  llm_model: agnes-3.0-flash
  rag_auto_inject: true
  memory_backend: local_sqlite   # 仅本地 ~/.pi/memory-data/pi_memory.db；无 Synapse 桥
  default_analysis_mode: normal   # fast | normal | deep
